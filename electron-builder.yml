appId: com.mariasaas.app
productName: MariaSaaS
directories:
  output: dist
  buildResources: build

# Fichiers à inclure dans l'application finale
files:
  - out/**/*
  - resources/**/*
  - node_modules/@prisma/client/**/*
  - prisma/dev.db
  - package.json

# 🟢 CRITIQUE : Force l'inclusion des binaires Prisma pour l'OS cible
extraResources:
  - from: node_modules/.prisma/client
    to: prisma-engine
    filter:
      - "*.node"
      - "*.exe"

# 🟢 Désactivation de la signature obligatoire
forceCodeSigning: false

# Configuration Windows
win:
  target:
    - nsis
  executableName: MariaSaaS
  icon: resources/icon.ico # Assure-toi d'avoir ce fichier .ico !
  # On dit explicitement à Windows de ne pas signer
  verifyUpdateCodeSignature: false

nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

linux:
  target:
    - deb
    - AppImage
  category: Utility
  icon: ressources/icon.png
mac:
  target: dmg
  category: public.app-category.healthcare
  icon: resources/icon.icns
publish:
  provider: github
  owner: TON_NOM_UTILISATEUR_GITHUB  # À REMPLACER PAR TON VRAI USERNAME !
  repo: MariaSaas