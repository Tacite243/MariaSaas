appId: com.mariasaas.app
productName: MariaSaaS
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - resources/**/*
  - prisma/schema.prisma
  - prisma/migrations/**/*
  - package.json

# Binaires Prisma / SQLite : hors ASAR (obligatoire pour .node et query engines)
asarUnpack:
  - '**/@prisma/**'
  - '**/node_modules/.prisma/**'
  - '**/node_modules/prisma/**'
  - '**/prisma/**'

forceCodeSigning: false

win:
  executableName: mariasaas
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  verifyUpdateCodeSignature: false

nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

portable:
  artifactName: ${productName}-Portable-${version}.${ext}

linux:
  target:
    - target: deb
      arch: x64
    - target: AppImage
      arch: x64
  maintainer: taciteiragi@gmail.com
  category: Utility
  icon: resources/icon.png
  artifactName: ${productName}-${version}.${ext}

mac:
  target: dmg
  icon: resources/icon.icns
  notarize: false

publish:
  provider: github
  owner: Tacite243
  repo: MariaSaas
