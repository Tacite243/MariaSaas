appId: com.mariasaas.app
productName: MariaSaaS
directories:
  output: dist
  buildResources: build

# 🟢 Configuration des fichiers inclus
files:
  - out/**/*
  - resources/**/*
  - node_modules/@prisma/client/**/*
  - node_modules/.prisma/client/**/*
  - prisma/dev.db
  - package.json

# 🟢 Sortie de l'archive ASAR pour les binaires Prisma (Indispensable pour Windows)
asarUnpack:
  - node_modules/.prisma/client/*.node
  - node_modules/.prisma/client/query-engine-windows.exe
  - resources/**

# 🟢 Paramètres globaux
forceCodeSigning: false

# 🔵 Configuration WINDOWS
win:
  executableName: mariasaas
  icon: resources/icon.ico
  target:
    - nsis
  verifyUpdateCodeSignature: false

nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

# 🟠 Configuration LINUX
linux:
  target:
    - deb
    - AppImage
  maintainer: taciteiragi@gmail.com
  category: Utility
  icon: resources/icon.png

# 🟣 Configuration MacOS
mac:
  target: dmg
  icon: resources/icon.icns
  notarize: false

publish:
  provider: github
  owner: Tacite243
  repo: MariaSaas